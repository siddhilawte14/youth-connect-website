    const { useState, useEffect, useMemo, useRef } = React;

    // --- POP-IN SCROLL REVEAL WRAPPER COMPONENT ---
    const ScrollReveal = ({ children, className = "", delay = 0, variant = "pop" }) => {
      const domRef = useRef(null);
      const [isVisible, setVisible] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              setVisible(true);
            }
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -25px 0px' });

        const el = domRef.current;
        if (el) observer.observe(el);
        return () => { if (el) observer.unobserve(el); };
      }, []);

      const getVariantStyle = () => {
        if (variant === 'left') {
          return isVisible 
            ? 'opacity-100 translate-x-0 scale-100 blur-none' 
            : 'opacity-0 -translate-x-12 scale-90 blur-[2px]';
        }
        if (variant === 'right') {
          return isVisible 
            ? 'opacity-100 translate-x-0 scale-100 blur-none' 
            : 'opacity-0 translate-x-12 scale-90 blur-[2px]';
        }
        // Default Spring Pop-In (Vertical + Scale + Blur reveal)
        return isVisible 
          ? 'opacity-100 translate-y-0 scale-100 blur-none' 
          : 'opacity-0 translate-y-10 scale-[0.88] blur-[2px]';
      };

      return (
        <div
          ref={domRef}
          className={`transition-all duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] will-change-transform ${getVariantStyle()} ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );
    };

    // --- INTERACTIVE FLUID CANVAS BACKGROUND WITH STARDUST PARTICLES ---
    const FluidBackground = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animationFrameId;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const resize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);

        const PALETTE = [
          { r: 139, g: 124, b: 182, a: 0.28 },
          { r: 99, g: 102, b: 241, a: 0.24 },
          { r: 236, g: 72, b: 153, a: 0.22 },
          { r: 59, g: 130, b: 246, a: 0.24 },
          { r: 168, g: 85, b: 247, a: 0.26 },
        ];

        const nodes = Array.from({ length: 6 }, (_, i) => ({
          baseX: (0.2 + 0.6 * Math.random()) * width,
          baseY: (0.2 + 0.6 * Math.random()) * height,
          x: width * 0.5,
          y: height * 0.5,
          radius: Math.min(width, height) * (0.32 + Math.random() * 0.2),
          color: PALETTE[i % PALETTE.length],
          freqX: 0.0004 + Math.random() * 0.0004,
          freqY: 0.0004 + Math.random() * 0.0004,
          phase: Math.random() * Math.PI * 2,
        }));

        const particles = Array.from({ length: 35 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2 + 0.5,
          speedX: (Math.random() - 0.5) * 0.4,
          speedY: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.6 + 0.2,
          pulse: Math.random() * Math.PI,
        }));

        let mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };
        const handleMove = (e) => {
          mouse.targetX = e.clientX;
          mouse.targetY = e.clientY;
        };
        window.addEventListener('mousemove', handleMove);

        const render = (t) => {
          mouse.x += (mouse.targetX - mouse.x) * 0.08;
          mouse.y += (mouse.targetY - mouse.y) * 0.08;

          ctx.clearRect(0, 0, width, height);

          nodes.forEach((n) => {
            const curX = n.baseX + Math.sin(t * n.freqX + n.phase) * (width * 0.15);
            const curY = n.baseY + Math.cos(t * n.freqY + n.phase) * (height * 0.15);

            const dx = mouse.x - curX;
            const dy = mouse.y - curY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 320;
            let pushX = 0, pushY = 0;
            if (dist < maxDist) {
              const force = (1 - dist / maxDist) * 55;
              pushX = -(dx / dist) * force;
              pushY = -(dy / dist) * force;
            }

            const grad = ctx.createRadialGradient(curX + pushX, curY + pushY, 0, curX + pushX, curY + pushY, n.radius);
            grad.addColorStop(0, `rgba(${n.color.r}, ${n.color.g}, ${n.color.b}, ${n.color.a})`);
            grad.addColorStop(0.6, `rgba(${n.color.r}, ${n.color.g}, ${n.color.b}, ${n.color.a * 0.4})`);
            grad.addColorStop(1, `rgba(${n.color.r}, ${n.color.g}, ${n.color.b}, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(curX + pushX, curY + pushY, n.radius, 0, Math.PI * 2);
            ctx.fill();
          });

          particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            const curAlpha = p.alpha + Math.sin(t * 0.002 + p.pulse) * 0.25;
            ctx.fillStyle = `rgba(236, 180, 254, ${Math.max(0.1, curAlpha)})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        animationFrameId = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', resize);
          window.removeEventListener('mousemove', handleMove);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none -z-10 overflow-hidden w-full h-full">
          <div 
            className="fixed inset-0 w-full h-full bg-cover bg-center opacity-70"
            style={{
              backgroundImage: `url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=2000&q=85')`,
              backgroundColor: '#070913'
            }}
          />
          <div className="absolute inset-0 bg-gradient-to-b from-[#070913]/75 via-[#070913]/45 to-[#070913]/92" />
          <canvas ref={canvasRef} className="w-full h-full block" />
          <div className="absolute inset-0 backdrop-blur-[30px]" />
        </div>
      );
    };

                          Select Payment Method
                        </label>
                        <div className="grid grid-cols-4 gap-2 text-xs">
                          {[
                            { id: 'upi', label: 'UPI / QR', icon: '⚡', badge: 'Popular' },
                            { id: 'card', label: 'Cards', icon: '💳', badge: null },
                            { id: 'netbanking', label: 'NetBanking', icon: '🏦', badge: null },
                            { id: 'wallet', label: 'Wallets', icon: '👛', badge: null }
                          ].map(tab => (
                            <button
                              key={tab.id}
                              type="button"
                              onClick={() => setRazorpayModal(prev => ({ ...prev, paymentMethod: tab.id, error: null }))}
                              className={`p-2 sm:p-2.5 rounded-2xl border text-center font-bold flex flex-col items-center gap-1 transition-all cursor-pointer relative ${
                                razorpayModal.paymentMethod === tab.id
                                  ? 'bg-gradient-to-b from-blue-600/40 to-sky-600/20 border-sky-400 text-white shadow-lg shadow-sky-500/20 scale-[1.02]'
                                  : 'bg-white/5 border-white/10 text-stone-300 hover:text-white hover:bg-white/10'
                              }`}
                            >
                              {tab.badge && (
                                <span className="absolute -top-2 right-1 text-[8px] font-extrabold uppercase bg-sky-500 text-black px-1.5 py-0.2 rounded-full shadow-xs">
                                  {tab.badge}
                                </span>
                              )}
                              <span className="text-base">{tab.icon}</span>
                              <span className="text-[10px]">{tab.label}</span>
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* 1. UPI Payment Section */}
                      {razorpayModal.paymentMethod === 'upi' && (
                        <div className="space-y-3.5 bg-white/5 p-4 rounded-2xl border border-white/10 animate-in fade-in">
                          {/* UPI Subtabs: Popular Apps vs UPI ID vs QR */}
                          <div className="grid grid-cols-3 p-1 bg-black/40 rounded-xl border border-white/10 text-[11px] font-bold text-center">
                            {[
                              { id: 'apps', label: 'UPI Apps' },
                              { id: 'id', label: 'UPI ID / VPA' },
                              { id: 'qr', label: 'Scan QR' }
                            ].map(sub => (
                              <button
                                key={sub.id}
                                type="button"
                                onClick={() => setRazorpayModal(prev => ({ ...prev, upiSubTab: sub.id }))}
                                className={`py-1.5 rounded-lg transition-all cursor-pointer ${
                                  (razorpayModal.upiSubTab || 'apps') === sub.id
                                    ? 'bg-sky-500 text-black font-extrabold shadow-sm'
                                    : 'text-stone-300 hover:text-white'
                                }`}
                              >
                                {sub.label}
                              </button>
                            ))}
                          </div>

                          {/* 1.1 UPI Apps Selector */}
                          {(razorpayModal.upiSubTab === 'apps' || !razorpayModal.upiSubTab) && (
                            <div className="space-y-2">
                              <span className="text-[10px] text-stone-400 block">Choose your preferred UPI App:</span>
                              <div className="grid grid-cols-3 gap-2">
                                {[
                                  { id: 'gpay', name: 'Google Pay', icon: '🟢', color: 'from-blue-900/40 to-emerald-900/40' },
                                  { id: 'phonepe', name: 'PhonePe', icon: '🟣', color: 'from-purple-900/40 to-indigo-900/40' },
                                  { id: 'paytm', name: 'Paytm UPI', icon: '🔵', color: 'from-sky-900/40 to-blue-900/40' },
                                  { id: 'bhim', name: 'BHIM UPI', icon: '🟠', color: 'from-orange-900/40 to-amber-900/40' },
                                  { id: 'cred', name: 'CRED UPI', icon: '⚪', color: 'from-zinc-900/40 to-stone-900/40' },
                                  { id: 'amazon', name: 'Amazon Pay', icon: '🟡', color: 'from-amber-900/40 to-yellow-900/40' },
                                ].map(app => (
                                  <button
                                    key={app.id}
                                    type="button"
                                    onClick={() => setRazorpayModal(prev => ({ ...prev, selectedUpiApp: app.id }))}
                                    className={`p-2 rounded-xl border flex items-center gap-2 transition-all cursor-pointer ${
                                      razorpayModal.selectedUpiApp === app.id
                                        ? 'bg-sky-500/30 border-sky-400 text-white shadow-md'
                                        : 'bg-white/5 border-white/10 text-stone-300 hover:text-white'
                                    }`}
                                  >
                                    <span className="text-base">{app.icon}</span>
                                    <span className="text-[11px] font-bold truncate">{app.name}</span>
                                  </button>
                                ))}
                              </div>
                            </div>
                          )}

                          {/* 1.2 UPI ID / VPA Input */}
                          {razorpayModal.upiSubTab === 'id' && (
                            <div className="space-y-2">
                              <label className="text-[10px] text-stone-300 block font-bold">
                                Enter Virtual Payment Address (VPA)
                              </label>
                              <div className="relative">
                                <input
                                  type="text"
                                  placeholder="e.g. mobile@okhdfcbank or user@upi"
                                  value={razorpayModal.upiId || ''}
                                  onChange={e => setRazorpayModal(prev => ({ ...prev, upiId: e.target.value }))}
                                  className="w-full px-3.5 py-2.5 rounded-xl bg-white/10 border border-white/20 text-white placeholder-stone-400 focus:outline-none focus:border-sky-400 text-xs font-mono"
                                />
                                <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-emerald-400 flex items-center gap-1">
                                  <Icon name="checkCircle" className="w-3 h-3" /> Valid
                                </span>
                              </div>
                              <div className="flex flex-wrap gap-1.5 pt-1">
                                {['@okhdfcbank', '@okaxis', '@ybl', '@paytm', '@ibl'].map(vpa => (
                                  <button
                                    key={vpa}
                                    type="button"
                                    onClick={() => {
                                      const base = (razorpayModal.upiId || 'siddhi').split('@')[0];
                                      setRazorpayModal(prev => ({ ...prev, upiId: `${base}${vpa}` }));
                                    }}
                                    className="px-2 py-0.5 rounded-md bg-white/10 hover:bg-white/20 text-[10px] font-mono text-sky-300 transition-colors cursor-pointer"
                                  >
                                    {vpa}
                                  </button>
                                ))}
                              </div>
                            </div>
                          )}

                          {/* 1.3 Live Dynamic UPI QR Code */}
                          {razorpayModal.upiSubTab === 'qr' && (
                            <div className="text-center space-y-2.5">
                              <div className="w-36 h-36 mx-auto bg-white p-2 rounded-2xl shadow-xl border-2 border-sky-400/60 relative flex items-center justify-center">
                                <img
                                  src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent('upi://pay?pa=youthconnect@razorpay&pn=YouthConnect&am=' + razorpayModal.amount + '&cu=INR&tn=' + encodeURIComponent(razorpayModal.event?.title || 'Pass'))}`}
                                  alt="Razorpay Dynamic UPI QR"
                                  className="w-full h-full object-contain rounded-lg"
                                />
                              </div>
                              <p className="text-[11px] text-sky-200">
                                Open <strong>GPay / PhonePe / Paytm</strong> & point camera at this QR code
                              </p>
                              <span className="inline-block text-[10px] font-mono text-stone-400 bg-black/40 px-2.5 py-0.5 rounded-full">
                                QR Expires in 04:58
                              </span>
                            </div>
                          )}
                        </div>
                      )}

                      {/* 2. Cards Section */}
                      {razorpayModal.paymentMethod === 'card' && (
                        <div className="space-y-3 bg-white/5 p-4 rounded-2xl border border-white/10 animate-in fade-in">
                          <div>
                            <div className="flex justify-between items-center mb-1">
                              <label className="text-[10px] text-stone-300 font-bold uppercase">Card Number</label>
                              <div className="flex gap-1.5 text-[10px] font-bold text-sky-300">
                                <span className="bg-white/10 px-1.5 py-0.2 rounded">VISA</span>
                                <span className="bg-white/10 px-1.5 py-0.2 rounded">Mastercard</span>
                                <span className="bg-white/10 px-1.5 py-0.2 rounded">RuPay</span>
                              </div>
                            </div>
                            <input
                              type="text"
                              value={razorpayModal.cardNumber || '4532 8920 1204 8492'}
                              onChange={e => setRazorpayModal(prev => ({ ...prev, cardNumber: e.target.value }))}
                              placeholder="4532 8920 1204 8492"
                              maxLength={19}
                              className="w-full px-3.5 py-2 rounded-xl bg-white/10 border border-white/20 text-white placeholder-stone-400 focus:outline-none focus:border-sky-400 text-xs font-mono tracking-wider"
                            />
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[10px] text-stone-300 block mb-1 font-bold uppercase">Expiry Date</label>
                              <input
                                type="text"
                                value={razorpayModal.cardExpiry || '12/28'}
                                onChange={e => setRazorpayModal(prev => ({ ...prev, cardExpiry: e.target.value }))}
                                placeholder="MM/YY"
                                maxLength={5}
                                className="w-full px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:border-sky-400 text-xs font-mono text-center"
                              />
                            </div>
                            <div>
                              <label className="text-[10px] text-stone-300 block mb-1 font-bold uppercase">CVV / CVC</label>
                              <input
                                type="password"
                                value={razorpayModal.cardCvv || '749'}
                                onChange={e => setRazorpayModal(prev => ({ ...prev, cardCvv: e.target.value }))}
                                placeholder="3 digits"
                                maxLength={4}
                                className="w-full px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:border-sky-400 text-xs font-mono text-center"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="text-[10px] text-stone-300 block mb-1 font-bold uppercase">Name on Card</label>
                            <input
                              type="text"
                              value={razorpayModal.cardName || 'Siddhi Lawte'}
                              onChange={e => setRazorpayModal(prev => ({ ...prev, cardName: e.target.value }))}
                              placeholder="e.g. Rahul Sharma"
                              className="w-full px-3.5 py-2 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:border-sky-400 text-xs"
                            />
                          </div>

                          <label className="flex items-center gap-2 pt-1 text-[11px] text-stone-300 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={razorpayModal.saveCard !== false}
                              onChange={e => setRazorpayModal(prev => ({ ...prev, saveCard: e.target.checked }))}
                              className="rounded border-white/20 text-sky-500 focus:ring-0"
                            />
                            <span>Save card securely as per RBI tokenization guidelines</span>
                          </label>
                        </div>
                      )}

                      {/* 3. NetBanking Section */}
                      {razorpayModal.paymentMethod === 'netbanking' && (
                        <div className="space-y-3 bg-white/5 p-4 rounded-2xl border border-white/10 animate-in fade-in">
                          <span className="text-[10px] text-stone-400 block font-bold uppercase">Popular Indian Banks</span>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                            {[
                              { name: 'HDFC Bank', code: 'HDFC' },
                              { name: 'State Bank of India', code: 'SBI' },
                              { name: 'ICICI Bank', code: 'ICICI' },
                              { name: 'Axis Bank', code: 'AXIS' },
                              { name: 'Kotak Bank', code: 'KOTAK' },
                              { name: 'Bank of Baroda', code: 'BOB' }
                            ].map(bank => (
                              <button
                                key={bank.code}
                                type="button"
                                onClick={() => setRazorpayModal(prev => ({ ...prev, selectedBank: bank.name }))}
                                className={`p-2 rounded-xl border text-left transition-all cursor-pointer ${
                                  razorpayModal.selectedBank === bank.name
                                    ? 'bg-sky-500/30 border-sky-400 text-white shadow-md'
                                    : 'bg-white/5 border-white/10 text-stone-300 hover:text-white'
                                }`}
                              >
                                <span className="font-bold text-[11px] block">{bank.name}</span>
                                <span className="text-[9px] text-stone-400 font-mono">{bank.code}</span>
                              </button>
                            ))}
                          </div>

                          <div className="pt-2">
                            <label className="text-[10px] text-stone-300 block mb-1 font-bold">Or select other bank:</label>
                            <select
                              value={razorpayModal.selectedBank || 'HDFC Bank'}
                              onChange={e => setRazorpayModal(prev => ({ ...prev, selectedBank: e.target.value }))}
                              className="w-full px-3 py-2 rounded-xl bg-[#0f172a] border border-white/20 text-white focus:outline-none text-xs"
                            >
                              <option>HDFC Bank</option>
                              <option>State Bank of India (SBI)</option>
                              <option>ICICI Bank</option>
                              <option>Axis Bank</option>
                              <option>Kotak Mahindra Bank</option>
                              <option>Punjab National Bank (PNB)</option>
                              <option>Canara Bank</option>
                              <option>Union Bank of India</option>
                              <option>Bank of Maharashtra</option>
                              <option>IndusInd Bank</option>
                              <option>Yes Bank</option>
                              <option>Federal Bank</option>
                            </select>
                          </div>
                        </div>
                      )}

                      {/* 4. Wallets Section */}
                      {razorpayModal.paymentMethod === 'wallet' && (
                        <div className="space-y-2 bg-white/5 p-4 rounded-2xl border border-white/10 animate-in fade-in">
                          <span className="text-[10px] text-stone-400 block font-bold uppercase">Supported Wallets</span>
                          <div className="grid grid-cols-2 gap-2">
                            {[
                              { id: 'amazon', name: 'Amazon Pay', balance: '₹420.00 available' },
                              { id: 'paytm_w', name: 'Paytm Wallet', balance: 'Link & Pay' },
                              { id: 'mobikwik', name: 'MobiKwik', balance: 'Link & Pay' },
                              { id: 'lazypay', name: 'LazyPay (PayLater)', balance: 'Pre-approved' }
                            ].map(w => (
                              <button
                                key={w.id}
                                type="button"
                                onClick={() => setRazorpayModal(prev => ({ ...prev, selectedWallet: w.name }))}
                                className={`p-2.5 rounded-xl border text-left transition-all cursor-pointer ${
                                  razorpayModal.selectedWallet === w.name
                                    ? 'bg-sky-500/30 border-sky-400 text-white shadow-md'
                                    : 'bg-white/5 border-white/10 text-stone-300 hover:text-white'
                                }`}
                              >
                                <span className="font-bold text-xs block text-white">{w.name}</span>
                                <span className="text-[10px] text-sky-300">{w.balance}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Action Pay Button with Multi-Phase Authorization */}
                      <div className="space-y-2 pt-2">
                        <button
                          type="button"
                          disabled={razorpayModal.isProcessing}
                          onClick={() => {
                            setRazorpayModal(prev => ({ ...prev, isProcessing: true, processingStep: 1, error: null }));
                            
                            setTimeout(() => {
                              setRazorpayModal(prev => ({ ...prev, processingStep: 2 }));
                            }, 700);

                            setTimeout(() => {
                              const paymentId = `pay_rzp_${Math.random().toString(36).substring(2, 9).toUpperCase()}`;
                              const pass = handleQuickRegisterConfirm(razorpayModal.event, razorpayModal.studentData, paymentId);
                              setRazorpayModal(prev => ({
                                ...prev,
                                isProcessing: false,
                                isSuccess: true,
                                razorpayPaymentId: paymentId,
                                issuedPass: pass
                              }));
                            }, 1400);
                          }}
                          className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 via-sky-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-sm shadow-[0_10px_25px_rgba(2,132,199,0.45)] transition-all cursor-pointer flex items-center justify-center gap-2 group active:scale-[0.99]"
                        >
                          <Icon name="lock" className="w-4 h-4 text-sky-200" />
                          <span>Pay ₹{razorpayModal.amount} via Razorpay Secure</span>
                          <Icon name="arrowRight" className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                        </button>

                        {/* Test Mode Decline Simulation */}
                        <div className="flex items-center justify-between text-[11px] pt-1 text-stone-400">
                          <span>Sandbox Test Controls:</span>
                          <button
                            type="button"
                            onClick={() => {
                              setRazorpayModal(prev => ({
                                ...prev,
                                error: 'Bank server declined the transaction (Error Code: ERR_PAY_002). Your account was NOT charged. Please retry or choose another payment method.'
                              }));
                            }}
                            className="text-rose-400 hover:text-rose-300 font-semibold cursor-pointer underline"
                          >
                            Simulate Bank Decline (Test Error)
                          </button>
                        </div>
                      </div>
                    </>
                  )}
                </div>

                {/* Razorpay Trust Footer */}
                <div className="bg-[#07111e] p-3 border-t border-white/10 flex items-center justify-between text-[10px] text-stone-400">
                  <div className="flex items-center gap-1.5">
                    <Icon name="shieldCheck" className="w-3.5 h-3.5 text-emerald-400" />
                    <span>Secured by <strong>Razorpay</strong> • PCI-DSS Compliant</span>
                  </div>
                  <span className="text-stone-500 font-mono">256-Bit SSL</span>
                </div>
              </div>
            </div>
          )}

          {/* Toast Alert with Smooth Slide-in */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-[10000] bg-[#181126] text-white px-4 py-3 rounded-2xl shadow-2xl border border-white/30 text-xs font-semibold flex items-center gap-2 animate-in slide-in-from-bottom-5 duration-200">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    // Render Root Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
